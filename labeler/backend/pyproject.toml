[project]
name = "mmohighlights-labeler"
version = "0.1.0"
description = "Fast image labeling (classification, boxes, polygons) with projects stored in Google Cloud Storage."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "google-cloud-storage>=2.19",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Copied verbatim from RaidDesigner; see scripts/vendor_dataset_format.py.
extend-exclude = ["app/vendor", "tests/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
